name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Supported Android Template
        run: |
          mkdir -p backup_lib
          cp -r lib/* backup_lib/ 2>/dev/null || true
          cp pubspec.yaml backup_pubspec.yaml 2>/dev/null || true
          
          rm -rf android
          
          flutter create --org com.ambionvra21 --project-name cashpaws --platforms=android .

          rm -rf lib
          mv backup_lib lib
          mv backup_pubspec.yaml pubspec.yaml

      - name: Force Android Gradle Plugin Upgrade
        run: |
          # 🌟 CRITICAL FIX: Upgrade AGP from 8.1.0 to 8.1.4 to meet dependency requirements
          SETTINGS_GRADLE="android/settings.gradle"
          if [ -f "$SETTINGS_GRADLE" ]; then
            sed -i 's/"com.android.application" version "[^"]*"/"com.android.application" version "8.1.4"/g' "$SETTINGS_GRADLE"
            echo "Successfully upgraded AGP version inside settings.gradle."
          else
            echo "Warning: settings.gradle not found, checking build.gradle fallback..."
            BUILD_GRADLE="android/build.gradle"
            if [ -f "$BUILD_GRADLE" ]; then
              sed -i 's/gradle:[0-9.]*/gradle:8.1.4/g' "$BUILD_GRADLE"
            fi
          fi

      - name: Inject AdMob App ID into Android Manifest Automatically
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/application>/i \        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-3940256099942544~3347511713"\/>' "$MANIFEST_PATH"
            echo "AdMob ID successfully injected natively."
          else
            echo "Error: Manifest file not found!"
            exit 1
          fi

      - name: Fetch App Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
