name: Build APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Scaffold Base Android Project Wrapper Structure
        run: |
          mkdir -p backup_src
          [ -f lib/main.dart ] && cp lib/main.dart backup_src/main.dart || true
          [ -f pubspec.yaml ] && cp pubspec.yaml backup_src/pubspec.yaml || true
          [ -f android/app/build.gradle ] && cp android/app/build.gradle backup_src/build.gradle || true
          [ -f android/app/src/main/AndroidManifest.xml ] && cp android/app/src/main/AndroidManifest.xml backup_src/AndroidManifest.xml || true
          
          flutter create --org com.cashpaws --project-name cashpaws --platforms=android .
          rm -rf test
          
          [ -f backup_src/main.dart ] && cp backup_src/main.dart lib/main.dart || true
          [ -f backup_src/pubspec.yaml ] && cp backup_src/pubspec.yaml pubspec.yaml || true
          [ -f backup_src/build.gradle ] && cp backup_src/build.gradle android/app/build.gradle || true
          [ -f backup_src/AndroidManifest.xml ] && cp backup_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          rm -rf backup_src

      - name: Resolve project dependencies cleanly
        run: flutter pub get

      - name: Compile Release Android Package (APK)
        run: flutter build apk --release
        
      - name: Upload compiled APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
