name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Supported Android Template
        run: |
          # 🌟 Move code temporarily to prevent conflicts
          mkdir -p backup_lib
          cp -r lib/* backup_lib/ 2>/dev/null || true
          cp pubspec.yaml backup_pubspec.yaml 2>/dev/null || true
          
          # Clean up any existing broken or partial android directories entirely
          rm -rf android
          
          # Let Flutter generate a brand new, up-to-date project shell matching your configuration
          flutter create --org com.cashpaws --project-name cashpaws --platforms=android .
          
          # Restore your custom code over the clean template shell
          rm -rf lib
          mv backup_lib lib
          mv backup_pubspec.yaml pubspec.yaml

      - name: Inject AdMob App ID into Android Manifest Automatically
        run: |
          # Use a shell script to inject your Google Test ID directly into the freshly generated manifest file safely
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/application>/i \        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-3940256099942544~3347511713"\/>' "$MANIFEST_PATH"
            echo "AdMob ID successfully injected natively."
          else
            echo "Error: Manifest file not found!"
            exit 1
          fi

      - name: Fetch App Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
