name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create the Android project files securely
        run: |
          # 🌟 Run create inside a temp directory so it doesn't overwrite your custom manifest
          mkdir temp_build
          cd temp_build
          flutter create --org com.cashpaws --project-name cashpaws --platforms=android .
          cd ..
          
          # Move generated configurations into place without destroying your files
          cp -r temp_build/android/app/src/main/java android/app/src/main/ 2>/all || true
          cp -r temp_build/android/build.gradle android/ 2>/all || true
          cp -r temp_build/android/settings.gradle android/ 2>/all || true
          rm -rf temp_build test

      - name: Force Android Gradle Plugin Upgrade
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/"com.android.application" version "[^"]*"/"com.android.application" version "8.1.4"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/gradle:[0-9.]*/gradle:8.1.4/g' android/build.gradle
          fi

      - name: Fetch App Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
