name: cashpaws
description: "A secure, passive earning reward application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.6.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 🌟 Google Mobile Ads package for Banner, Interstitial, and Rewarded Ads
  google_mobile_ads: ^5.1.0

  # 🌟 Supabase Integration Package for Cloud Point-Tracking
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
