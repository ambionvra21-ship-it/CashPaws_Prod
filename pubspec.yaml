name: cashpaws
description: "A gamified virtual pet earning reward application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Backend & State Architecture
  supabase_flutter: ^2.0.0 # Make sure this matches your schema build
  crypto: ^3.0.3

  # Google Mobile Ads SDK (Required for Banner & Rewarded Ads)
  google_mobile_ads: ^5.1.0

  # UI Design Dependencies
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Add asset declarations here if your animal profile pictures are local
