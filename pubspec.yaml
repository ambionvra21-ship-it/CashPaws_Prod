name: Build APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false # Wipes stale action caches permanently

      - name: Purge Obsolete Multi-File Workspace Cross-Links
        run: |
          rm -f lib/admob_service.dart
          rm -f lib/supabase_service.dart
          flutter clean

      - name: Create project workspace files
        run: |
          flutter create --org com.cashpaws --project-name cashpaws --platforms=android .
          rm -rf test

      - name: Force Gradle and AGP Version Upgrades
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/"com.android.application" version "[^"]*"/"com.android.application" version "8.1.4"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/gradle:[0-9.]*/gradle:8.1.4/g' android/build.gradle
          fi

      - name: Apply CashPaws customization scripts
        run: |
          if [ -f tools/configure_android.py ]; then
            python3 tools/configure_android.py
          fi

      - name: Resolve project dependencies cleanly
        run: flutter pub get

      - name: Compile Release Android Package (APK)
        run: flutter build apk --release
        
      - name: Upload compiled APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cashpaws-apk
          path: build/app/outputs/flutter-apk/app-release.apk
